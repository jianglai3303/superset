services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.2
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
    command:
      - start-dev
      - --http-port=8080
    ports:
      - 8080:8080
    restart: unless-stopped
    networks:
      - shared_net
networks:
  shared_net:
    external: true
